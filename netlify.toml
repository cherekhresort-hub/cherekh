[build]
  command = "npm install --prefix netlify/functions && npm run build"
  publish = "dist"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Team access API - rewrite before SPA fallback in dist/_redirects
[[redirects]]
  from = "/api/team-members"
  to = "/.netlify/functions/team-members"
  status = 200

[build.environment]
  NODE_VERSION = "20"
  NODE_OPTIONS = "--max-old-space-size=4096"

# www → apex for primary domain
[[redirects]]
  from = "http://www.cherekhcenter.com/*"
  to = "https://cherekhcenter.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.cherekhcenter.com/*"
  to = "https://cherekhcenter.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://cherekhcenter.com/*"
  to = "https://cherekhcenter.com/:splat"
  status = 301
  force = true

# Legacy domain → apex
[[redirects]]
  from = "http://www.cherekhresort.com/*"
  to = "https://cherekhcenter.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.cherekhresort.com/*"
  to = "https://cherekhcenter.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://cherekhresort.com/*"
  to = "https://cherekhcenter.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://cherekhresort.com/*"
  to = "https://cherekhcenter.com/:splat"
  status = 301
  force = true

# SPA fallback + prerendered route rules: generated in dist/_redirects at build time

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://maps.googleapis.com https://*.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.emailjs.com https://www.google-analytics.com https://www.googletagmanager.com https://maps.googleapis.com https://*.google.com; frame-src 'self' https://www.google.com https://maps.google.com https://www.youtube.com https://www.youtube-nocookie.com"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/cherekhImages/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
